name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
        env:
          APP_PASSWORD: ci-only-password
          SESSION_SECRET: ci-only-session-secret-at-least-32-chars
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
